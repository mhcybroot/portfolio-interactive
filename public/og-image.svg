<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a14" />
      <stop offset="100%" stop-color="#0b1222" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(31, 46, 77, 0.4)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1.5" fill="rgba(0, 245, 212, 0.3)"/>
    </pattern>
    <!-- Ambient Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid -->
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Light Blooms -->
  <circle cx="150" cy="120" r="220" fill="#00f5d4" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="480" r="260" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="300" r="180" fill="#a855f7" opacity="0.08" filter="url(#glow)" />

  <!-- Outer Border Frame -->
  <rect x="25" y="25" width="1150" height="580" rx="24" fill="none" stroke="rgba(31, 46, 77, 0.8)" stroke-width="2" />

  <!-- Status Pill -->
  <g transform="translate(70, 75)">
    <rect width="320" height="36" rx="18" fill="rgba(11, 18, 34, 0.9)" stroke="rgba(0, 245, 212, 0.4)" stroke-width="1.5" />
    <circle cx="20" cy="18" r="5" fill="#00f5d4" />
    <text x="36" y="23" fill="#cbd5e1" font-family="monospace" font-size="13" font-weight="600" letter-spacing="1">
      FULL-STACK &amp; SYSTEMS ENGINEER
    </text>
  </g>

  <!-- Main Headline -->
  <text x="70" y="195" fill="#ffffff" font-family="sans-serif" font-size="58" font-weight="900" letter-spacing="-1.5">
    Mahmudul Hasan
  </text>
  
  <!-- Gradient Subtitle -->
  <text x="70" y="260" fill="url(#cyanGrad)" font-family="sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    High-Concurrency Systems, IoT Protocols &amp; 3D Web
  </text>

  <!-- Descriptive Subtext -->
  <text x="70" y="320" fill="#94a3b8" font-family="sans-serif" font-size="20" font-weight="400">
    Java 21 Spring Boot • Rust 2024 Axum • ZKTeco ADMS • React 19 • PostgreSQL
  </text>

  <!-- Metric Badges Row -->
  <g transform="translate(70, 390)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="240" height="120" rx="16" fill="rgba(11, 18, 34, 0.8)" stroke="rgba(31, 46, 77, 0.9)" stroke-width="1.5"/>
    <text x="24" y="52" fill="#00f5d4" font-family="monospace" font-size="36" font-weight="800">2.5+ Yrs</text>
    <text x="24" y="85" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="600">Production Systems</text>

    <!-- Metric 2 -->
    <rect x="270" y="0" width="240" height="120" rx="16" fill="rgba(11, 18, 34, 0.8)" stroke="rgba(31, 46, 77, 0.9)" stroke-width="1.5"/>
    <text x="294" y="52" fill="#38bdf8" font-family="monospace" font-size="36" font-weight="800">10 Repos</text>
    <text x="294" y="85" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="600">Verified Codebases</text>

    <!-- Metric 3 -->
    <rect x="540" y="0" width="240" height="120" rx="16" fill="rgba(11, 18, 34, 0.8)" stroke="rgba(31, 46, 77, 0.9)" stroke-width="1.5"/>
    <text x="564" y="52" fill="#a855f7" font-family="monospace" font-size="36" font-weight="800">4 Live</text>
    <text x="564" y="85" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="600">Commercial Deployments</text>

    <!-- Metric 4 -->
    <rect x="810" y="0" width="250" height="120" rx="16" fill="rgba(11, 18, 34, 0.8)" stroke="rgba(31, 46, 77, 0.9)" stroke-width="1.5"/>
    <text x="834" y="52" fill="#34d399" font-family="monospace" font-size="36" font-weight="800">3.75 CGPA</text>
    <text x="834" y="85" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="600">Dhaka Polytechnic (DPI)</text>
  </g>

  <!-- Bottom Brand Mark -->
  <g transform="translate(70, 560)">
    <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="14">
      github.com/mhcybroot/portfolio-interactive
    </text>
  </g>
</svg>
